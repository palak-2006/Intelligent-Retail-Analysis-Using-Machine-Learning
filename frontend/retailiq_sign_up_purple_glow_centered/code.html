<script>
    const BASE_URL = window.location.origin.startsWith('http') ? window.location.origin : 'http://localhost:5000';

    function getPageUrl(page) {
        if (window.location.protocol === 'file:') {
            const map = {
                dashboard: '../retailiq_dashboard_theme_toggle_purple_glow/code.html',
                login: '../retailiq_login_silk_white_bg/code.html',
                signup: '../retailiq_sign_up_purple_glow_centered/code.html',
                sales: '../retailiq_sales_analytics_theme_toggle_pie_chart/code.html',
                segmentation: '../retailiq_customer_segmentation_theme_toggle_purple_glow/code.html',
                'customer-details': '../retailiq_customer_details_theme_toggle_purple_glow/code.html'
            };
            return map[page] || page;
        }
        return '/' + page;
    }

    // ── Setup Links & Interactions ────────────────────────────────────────────
    document.addEventListener('DOMContentLoaded', function() {
        const signinLink = document.getElementById('signin-link');
        if (signinLink) {
            signinLink.href = getPageUrl('login');
        }

        const termsInput = document.getElementById('terms');
        const termsBox   = document.getElementById('termsBox');
        if (termsInput && termsBox) {
            termsInput.addEventListener('change', function() {
                if (this.checked) {
                    termsBox.classList.remove('text-transparent');
                    termsBox.classList.add('text-primary');
                } else {
                    termsBox.classList.remove('text-primary');
                    termsBox.classList.add('text-transparent');
                }
            });
        }
    });

    // ── Show / Hide Password ───────────────────────────────────────────────────
    const togglePasswordBtn  = document.getElementById('togglePassword');
    const togglePasswordIcon = document.getElementById('togglePasswordIcon');
    const passwordInput      = document.getElementById('password');

    togglePasswordBtn.addEventListener('click', function () {
        const isPassword = passwordInput.type === 'password';
        passwordInput.type = isPassword ? 'text' : 'password';
        togglePasswordIcon.textContent = isPassword ? 'visibility_off' : 'visibility';
    });

    // ── Password Strength Indicator ────────────────────────────────────────────
    const strengthContainer = document.getElementById('strengthContainer');
    const strengthBar       = document.getElementById('strengthBar');
    const strengthLabel     = document.getElementById('strengthLabel');

    function getPasswordStrength(pwd) {
        if (!pwd) return { score: 0, label: '', color: '' };
        let score = 0;
        if (pwd.length >= 8)  score++;
        if (pwd.length >= 12) score++;
        if (/[A-Z]/.test(pwd)) score++;
        if (/[0-9]/.test(pwd)) score++;
        if (/[^A-Za-z0-9]/.test(pwd)) score++;

        if (score <= 1) return { pct: '33%',  label: 'Weak',   color: '#dc2626' };
        if (score <= 3) return { pct: '66%',  label: 'Medium', color: '#f97316' };
        return               { pct: '100%', label: 'Strong', color: '#16a34a' };
    }

    passwordInput.addEventListener('input', function () {
        const val = this.value;
        if (!val) {
            strengthContainer.style.display = 'none';
            return;
        }
        strengthContainer.style.display = 'block';
        const { pct, label, color } = getPasswordStrength(val);
        strengthBar.style.width           = pct;
        strengthBar.style.backgroundColor = color;
        strengthLabel.textContent         = label;
        strengthLabel.style.color         = color;
    });

    // ── Error display helper ───────────────────────────────────────────────────
    function showError(message) {
        const errorMsg  = document.getElementById('errorMsg');
        const errorText = document.getElementById('errorText');
        if (errorText) errorText.textContent = message;
        if (errorMsg) {
            errorMsg.style.display = 'flex';
            errorMsg.classList.remove('error-msg');
            void errorMsg.offsetWidth; // Force DOM reflow to re-trigger CSS shake animation
            errorMsg.classList.add('error-msg');
        }
    }

    function hideError() {
        const errorMsg = document.getElementById('errorMsg');
        if (errorMsg) {
            errorMsg.style.display = 'none';
        }
    }

    // ── Loading state helpers ──────────────────────────────────────────────────
    function setLoading(isLoading) {
        const btn     = document.getElementById('submitBtn');
        const btnText = document.getElementById('submitBtnText');
        const btnIcon = document.getElementById('submitBtnIcon');
        const spinner = document.getElementById('submitSpinner');

        if (btn) btn.disabled          = isLoading;
        if (btnText) btnText.textContent   = isLoading ? 'Creating Account…' : 'Create Account';
        if (btnIcon) btnIcon.style.display = isLoading ? 'none' : 'inline-block';
        if (spinner) spinner.style.display = isLoading ? 'inline-block' : 'none';
    }

    // ── Form Submit ────────────────────────────────────────────────────────────
    document.getElementById('signupForm').addEventListener('submit', async function (e) {
        e.preventDefault();
        hideError();

        const name     = document.getElementById('name').value.trim();
        const email    = document.getElementById('email').value.trim();
        const password = document.getElementById('password').value;
        const terms    = document.getElementById('terms').checked;

        // Client-side guards
        if (!name || !email || !password) {
            showError('Please fill in all required fields.');
            return;
        }

        const emailRegex = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;
        if (!emailRegex.test(email)) {
            showError('Please enter a valid email address.');
            return;
        }

        if (password.length < 6) {
            showError('Password must be at least 6 characters.');
            return;
        }

        if (!terms) {
            showError('You must agree to the Terms and Privacy Policy to continue.');
            return;
        }

        setLoading(true);

        try {
            const response = await fetch(`${BASE_URL}/api/auth/register`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ name, email, password }),
            });

            const data = await response.json().catch(() => ({}));

            if (response.status === 201) {
                // Success — persist user session and redirect
                if (data.token) localStorage.setItem('retailiq_token', data.token);
                if (data.name  || name)  localStorage.setItem('retailiq_name',  data.name  || name);
                if (data.email || email) localStorage.setItem('retailiq_email', data.email || email);
                window.location.href = getPageUrl('dashboard');
            } else if (response.status === 409) {
                showError('An account with this email already exists. Please sign in instead.');
            } else if (response.status === 400) {
                const msg = data.message || data.error || 'Invalid details. Please check your input and try again.';
                showError(msg);
            } else {
                const msg = data.message || data.error || 'Something went wrong. Please try again later.';
                showError(msg);
            }
        } catch (err) {
            showError('Unable to connect to the server. Please check your connection and try again.');
        } finally {
            setLoading(false);
        }
    });
</script>
</body></html>
