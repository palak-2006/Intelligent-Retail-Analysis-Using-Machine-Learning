<!DOCTYPE html><html class="light" lang="en"><head>
<meta charset="utf-8">
<meta content="width=device-width, initial-scale=1.0" name="viewport">
<title>RetailIQ - Login</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com" rel="preconnect">
<link crossorigin="" href="https://fonts.gstatic.com" rel="preconnect">
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&amp;display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet">

                        "tertiary-fixed": "var(--color-tertiary-fixed)",

                        "tertiary": "var(--color-tertiary)",
                        "surface-tint": "var(--color-surface-tint)",
                        "secondary-fixed": "var(--color-secondary-fixed)",
                        "on-secondary": "var(--color-on-secondary)",
                        "on-secondary-container": "var(--color-on-secondary-container)",
                        "inverse-primary": "var(--color-inverse-primary)",
                        "surface-container-low": "var(--color-surface-container-low)",
                        "secondary-container": "var(--color-secondary-container)",
                        "outline": "var(--color-outline)",
                        "on-secondary-fixed": "var(--color-on-secondary-fixed)",
                        "surface-container-high": "var(--color-surface-container-high)",
                        "primary": "var(--color-primary)",
                        "primary-fixed": "var(--color-primary-fixed)",
                        "surface-dim": "var(--color-surface-dim)",
                        "on-error-container": "var(--color-on-error-container)",
                        "surface": "var(--color-surface)",
                        "on-secondary-fixed-variant": "var(--color-on-secondary-fixed-variant)",
                        "outline-variant": "var(--color-outline-variant)",
                        "inverse-on-surface": "var(--color-inverse-on-surface)",
                        "background": "var(--color-background)",
                        "surface-variant": "var(--color-surface-variant)",
                        "inverse-surface": "var(--color-inverse-surface)",
                        "on-tertiary-fixed-variant": "var(--color-on-tertiary-fixed-variant)",
                        "on-primary": "var(--color-on-primary)",
                        "secondary": "var(--color-secondary)",
                        "on-surface-variant": "var(--color-on-surface-variant)",
                        "on-primary-fixed-variant": "var(--color-on-primary-fixed-variant)",
                        "error": "var(--color-error)",
                        "on-tertiary": "var(--color-on-tertiary)",
                        "tertiary-container": "var(--color-tertiary-container)",
                        "surface-bright": "var(--color-surface-bright)",
                        "surface-container": "var(--color-surface-container)",
                        "on-tertiary-container": "var(--color-on-tertiary-container)",
                        "on-background": "var(--color-on-background)",
                        "tertiary-fixed-dim": "var(--color-tertiary-fixed-dim)",
                        "primary-container": "var(--color-primary-container)",
                        "surface-container-highest": "var(--color-surface-container-highest)",
                        "on-tertiary-fixed": "var(--color-on-tertiary-fixed)",
                        "error-container": "var(--color-error-container)",
                        "secondary-fixed-dim": "var(--color-secondary-fixed-dim)",
                        "surface-container-lowest": "var(--color-surface-container-lowest)",
                        "on-primary-fixed": "var(--color-on-primary-fixed)",
                        "primary-fixed-dim": "var(--color-primary-fixed-dim)"
                    },
                    "borderRadius": {
                        "DEFAULT": "0.5rem",
                        "lg": "1rem",
                        "xl": "1.5rem",
                        "full": "9999px"
                    },
                    "fontFamily": {
                        "headline": ["Plus Jakarta Sans"],
                        "display": ["Plus Jakarta Sans"],
                        "body": ["Plus Jakarta Sans"],
                        "label": ["Plus Jakarta Sans"]
                    }
                }
            }
        }
    </script>
<style>
        :root {
            --color-on-tertiary-fixed: #2e1065;
            --color-on-secondary-fixed-variant: #404252;
            --color-surface-container-lowest: #f0f2f8;
            --color-primary-fixed-dim: #a5b4fc;
            --color-secondary-container: #d8dae6;
            --color-tertiary: #7c3aed;
            --color-primary-fixed: #e0e2ff;
            --color-on-background: #2e3040;
            --color-on-tertiary-container: #3b1f63;
            --color-on-tertiary-fixed-variant: #5b21b6;
            --color-surface-container: #e2e4ea;
            --color-surface-variant: #dcdee4;
            --color-surface-container-low: #e5e7ed;
            --color-tertiary-container: #a78bfa;
            --color-surface-container-high: #dcdee4;
            --color-outline: #8a8c9a;
            --color-primary: #6366f1;
            --color-surface-dim: #d4d6dc;
            --color-surface-tint: #6366f1;
            --color-error: #dc2626;
            --color-background: #e8eaf0;
            --color-on-tertiary: #ffffff;
            --color-inverse-primary: #a5b4fc;
            --color-on-surface-variant: #585a68;
            --color-tertiary-fixed: #ede9fe;
            --color-on-primary-container: #e0e2ff;
            --color-surface-container-highest: #d6d8de;
            --color-on-secondary: #ffffff;
            --color-on-secondary-fixed: #1a1b26;
            --color-surface-bright: #edeef4;
            --color-on-error: #ffffff;
            --color-tertiary-fixed-dim: #c4b5fd;
            --color-secondary-fixed: #d8dae6;
            --color-outline-variant: #d0d2dc;
            --color-secondary-fixed-dim: #b8baca;
            --color-surface: #e8eaf0;
            --color-on-primary: #ffffff;
            --color-error-container: #fee2e2;
            --color-on-secondary-container: #585a68;
            --color-on-primary-fixed-variant: #4338ca;
            --color-on-primary-fixed: #1e1b4b;
            --color-inverse-on-surface: #e8eaf0;
            --color-on-surface: #2e3040;
            --color-primary-container: #818cf8;
            --color-inverse-surface: #2e3040;
            --color-secondary: #6c6e7e;
            --color-on-error-container: #991b1b;

            --neo-shadow-light-1: #ffffff;
            --neo-shadow-dark-1: #c5c7cc;
            --neo-shadow-purple-light: #ffffff;
            --neo-shadow-purple-dark: #d8b4fe;
            --neo-bg: #e8eaf0;
        }

        .dark {
            --color-surface: #13131b;
            --color-surface-dim: #13131b;
            --color-surface-bright: #393841;
            --color-surface-container-lowest: #0d0d15;
            --color-surface-container-low: #1b1b23;
            --color-surface-container: #1f1f28;
            --color-surface-container-high: #2a2a33;
            --color-surface-container-highest: #34343f;
            --color-on-surface: #e5e5eb;
            --color-on-surface-variant: #c9c9d0;
            --color-outline: #93939b;
            --color-outline-variant: #48484f;
            --color-inverse-surface: #e5e5eb;
            --color-inverse-on-surface: #303037;
            --color-primary: #bec2ff;
            --color-on-primary: #2a2b84;
            --color-primary-container: #4447a1;
            --color-on-primary-container: #e0e0ff;
            --color-secondary: #c9c5d0;
            --color-on-secondary: #303037;
            --color-secondary-container: #47464e;
            --color-on-secondary-container: #e5e1eb;
            --color-tertiary: #cbbffff;
            --color-on-tertiary: #301f80;
            --color-tertiary-container: #493998;
            --color-on-tertiary-container: #e7deff;
            --color-error: #ffb4ab;
            --color-on-error: #690005;
            --color-error-container: #93000a;
            --color-on-error-container: #ffdad6;
            --color-background: #13131b;
            --color-on-background: #e5e5eb;

            --neo-shadow-light-1: #1f1f2a;
            --neo-shadow-dark-1: #07070c;
            --neo-shadow-purple-light: #2a2b84;
            --neo-shadow-purple-dark: #3b1f63;
            --neo-bg: #13131b;
        }

        body {
            font-family: 'Plus Jakarta Sans', sans-serif;
            background-color: var(--color-background);
            color: var(--color-on-surface);
            transition: background-color 0.3s ease, color 0.3s ease;
        }

        /* Silk Neomorphic Utilities */
        .neo-surface {
            background: var(--neo-bg);
            box-shadow: 8px 8px 16px var(--neo-shadow-dark-1), -8px -8px 16px var(--neo-shadow-light-1);
            transition: all 0.3s ease;
        }
        .neo-surface:hover {
            box-shadow: 12px 12px 20px var(--neo-shadow-purple-dark), -12px -12px 20px var(--neo-shadow-purple-light);
        }

        .neo-inset {
            background: var(--neo-bg);
            box-shadow: inset 4px 4px 8px var(--neo-shadow-dark-1), inset -4px -4px 8px var(--neo-shadow-light-1);
            transition: all 0.3s ease;
        }

        .neo-inset:focus, .neo-inset-focus:focus-within {
            box-shadow: inset 4px 4px 8px var(--neo-shadow-purple-dark), inset -4px -4px 8px var(--neo-shadow-purple-light), 0 0 10px rgba(99,102,241,0.1);
        }

        .neo-button {
            background: var(--neo-bg);
            box-shadow: 6px 6px 12px var(--neo-shadow-dark-1), -6px -6px 12px var(--neo-shadow-light-1);
            transition: all 0.2s ease-in-out;
        }

        .neo-button:hover {
            box-shadow: 8px 8px 16px var(--neo-shadow-purple-dark), -8px -8px 16px var(--neo-shadow-purple-light);
            transform: translateY(-2px);
        }

        .neo-button:active {
            box-shadow: inset 4px 4px 8px var(--neo-shadow-dark-1), inset -4px -4px 8px var(--neo-shadow-light-1);
            transform: scale(0.98) translateY(0);
        }

        .slide-in-right {
            animation: slideInRight 0.6s cubic-bezier(0.25, 0.46, 0.45, 0.94) forwards;
            opacity: 0;
            transform: translateX(40px);
        }

        @keyframes slideInRight {
            to {
                opacity: 1;
                transform: translateX(0);
            }
        }
    </style>
<script>
        function toggleTheme() {
            document.documentElement.classList.toggle('dark');
        }
    </script>
</head>
<body class="bg-surface min-h-screen flex items-center justify-center p-4 relative transition-colors duration-300">
<!-- Login Card -->
<main class="neo-surface rounded-[1.5rem] w-full max-w-md p-8 sm:p-10 slide-in-right relative overflow-visible z-10">
<!-- Logo Header -->
<header class="flex flex-col items-center mb-8 relative">
<button aria-label="Toggle Theme" class="absolute -top-4 -right-4 p-2 w-10 h-10 neo-button rounded-full flex items-center justify-center text-on-surface-variant hover:text-primary focus:outline-none z-20" onclick="toggleTheme()" type="button">
<span class="material-symbols-outlined text-[20px] dark:hidden">dark_mode</span>
<span class="material-symbols-outlined text-[20px] hidden dark:block">light_mode</span>
</button>
<div class="w-20 h-20 mb-6 neo-surface rounded-full flex items-center justify-center overflow-hidden p-2">
<img alt="RetailIQ Logo" class="w-full h-full object-contain rounded-full" src="https://lh3.googleusercontent.com/aida/AEtjO1XNWaDYqESn9L4npk6kajTg8onHH-YLsYHmP9QcM4JER1DBaR7ddyV5NM4KhUaJsVnL43CvkVsVtpoUmRfWdHgP1FTSINn_Z0CuYhF6K5hkbqX8efwAlvrXMHJTYNqI2QbZI1nMlO983NJ4FJ0l04qAyhnx541bW3dZziHg7Y1FjHE4pmwRP_w7yQQ2lKcz3lO44gsVey8QvBjR8td4w66e8Md-LKtYkneWAP2Hx8EnWHvw3hNO8WDbgPX1">
</div>
<h1 class="text-2xl font-headline font-semibold text-on-surface mb-2 tracking-tight">Secure Access</h1>
<p class="text-sm font-body text-on-surface-variant text-center">Enter your credentials to access your RetailIQ dashboard.</p>
</header>
<!-- Login Form -->
<form class="space-y-6" onsubmit="event.preventDefault();">
<!-- Email Input -->
<div class="space-y-2">
<label class="block text-sm font-medium text-on-surface ml-2" for="email">Email Address</label>
<div class="relative neo-inset-focus rounded-lg">
<span class="material-symbols-outlined absolute left-4 top-1/2 -translate-y-1/2 text-on-surface-variant pointer-events-none transition-colors peer-focus:text-primary">mail</span>
<input class="w-full pl-12 pr-4 py-4 neo-inset rounded-lg border-none focus:ring-0 text-on-surface font-body bg-transparent focus:outline-none peer" id="email" name="email" placeholder="admin@retailiq.com" required="" type="email">
</div>
</div>
<!-- Password Input -->
<div class="space-y-2">
<div class="flex justify-between items-center ml-2 mr-2">
<label class="block text-sm font-medium text-on-surface" for="password">Password</label>
<a class="text-xs font-medium text-primary hover:text-tertiary transition-colors" href="#">Forgot Password?</a>
</div>
<div class="relative neo-inset-focus rounded-lg">
<span class="material-symbols-outlined absolute left-4 top-1/2 -translate-y-1/2 text-on-surface-variant pointer-events-none transition-colors peer-focus:text-primary">lock</span>
<input class="w-full pl-12 pr-12 py-4 neo-inset rounded-lg border-none focus:ring-0 text-on-surface font-body bg-transparent focus:outline-none peer" id="password" name="password" placeholder="••••••••" required="" type="password">
<button class="absolute right-4 top-1/2 -translate-y-1/2 text-on-surface-variant hover:text-primary transition-colors focus:outline-none" type="button">
<span class="material-symbols-outlined">visibility</span>
</button>
</div>
</div>
<!-- Remember Me -->
<div class="flex items-center ml-2">
<div class="relative flex items-center">
<input class="peer sr-only" id="remember" type="checkbox">
<div class="w-5 h-5 neo-inset rounded border-none bg-surface flex items-center justify-center peer-checked:text-primary text-transparent transition-colors cursor-pointer" onclick="document.getElementById('remember').click()">
<span class="material-symbols-outlined text-[16px]" style="font-variation-settings: 'FILL' 1;">check</span>
</div>
</div>
<label class="ml-3 block text-sm font-body text-on-surface-variant cursor-pointer" for="remember">Remember me for 30 days</label>
</div>
<!-- Submit Button -->
<button class="w-full py-4 neo-button rounded-lg flex items-center justify-center gap-2 group mt-8" type="submit">
<span class="font-semibold font-body text-primary transition-colors">Sign In</span>
<span class="material-symbols-outlined text-primary transition-colors">arrow_forward</span>
</button>
</form>
<!-- Footer Links -->
<div class="mt-8 pt-6 border-t border-surface-variant/50 text-center">
<p class="text-sm font-body text-on-surface-variant">
                Don't have an account? 
                <a class="font-medium text-primary hover:text-tertiary transition-colors ml-1" href="#">Create Account</a>
</p>
</div>
</main>
</body></html>
